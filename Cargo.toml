[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
    "crates/tie-ssh",
    "crates/tie-pty",
    "crates/tie-store",
]
default-members = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
authors = ["Tie Contributors"]

[workspace.dependencies]
tie-ssh = { path = "crates/tie-ssh" }
tie-pty = { path = "crates/tie-pty" }
tie-store = { path = "crates/tie-store" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs"] }
russh = "0.64"
russh-sftp = "3"
portable-pty = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
dirs = "6"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
futures = "0.3"
parking_lot = "0.12"
base64 = "0.22"
which = "7"
